# Servidor dedicado Left 4 Dead 2 — versus vanilla (4 vs 4), sin mods
#
#   Arrancar:      docker compose up -d --build
#   Ver logs:      docker compose logs -f
#   Consola:       docker attach l4d2-server      (salir sin apagar: Ctrl+P, Ctrl+Q)
#   Apagar:        docker compose down
#
# El primer arranque descarga el servidor (~10 GB); tarda bastante.

name: l4d2

services:
  l4d2:
    build:
      context: ./docker
      args:
        MMS_BRANCH: "1.12"        # MetaMod:Source
        SM_BRANCH: "1.12"         # SourceMod (solo para admins)
    image: l4d2-vanilla:latest
    container_name: l4d2-server
    restart: unless-stopped
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
    environment:
      SERVER_NAME: "L4D2 Versus"
      GAME_MODE: "versus"         # coop, realism, survival, scavenge...
      START_MAP: "c1m1_hotel"     # c2m1_highway, c5m1_waterfront...
      VAC: "0"                    # 1 = antitrampas VAC activado, 0 = desactivado (-insecure)
      RCON_PASSWORD: "${RCON_PASSWORD:-}"
      SERVER_PASSWORD: "${SERVER_PASSWORD:-}"
      UPDATE_ON_START: "1"        # 0 = no buscar actualizaciones del juego al arrancar
    volumes:
      - l4d2-data:/home/steam/l4d2   # archivos del juego (persisten entre reinicios)
      - ./config:/config:ro          # se copia encima de left4dead2/ en cada arranque
    stdin_open: true
    tty: true
    stop_grace_period: 30s

volumes:
  l4d2-data:
