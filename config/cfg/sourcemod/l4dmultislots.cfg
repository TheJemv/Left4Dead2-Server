// MultiSlots (github.com/fbef0102/L4D1_2-Plugins/tree/master/l4dmultislots)
// No toques "survivor_limit" en ningún cfg: este plugin lo controla.

// Máximo de supervivientes en la partida
l4d_multislots_max_survivors "8"

// Mínimo de supervivientes (se rellenan con bots)
// Pon "8" y abajo spawn_survivors_roundstart "1" para jugar SIEMPRE con 8 (bots incluidos)
l4d_multislots_min_survivors "4"
l4d_multislots_spawn_survivors_roundstart "0"

// 0 = el jugador 5+ siempre aparece vivo, aunque el grupo ya haya salido del refugio
l4d_multislots_alive_bot_time "0"

// Botiquines extra (uno por cada jugador por encima de 4) en el refugio inicial y en el final
l4d_multislots_saferoom_extra_first_aid "1"
l4d_multislots_finale_extra_first_aid "1"

// Armas del jugador 5+ al aparecer tarde (19 = T2 aleatoria, 5 = secundaria aleatoria, 4 = arrojadiza aleatoria)
l4d_multislots_firstweapon "19"
l4d_multislots_secondweapon "5"
l4d_multislots_thirdweapon "4"

// Segundos de invulnerabilidad al aparecer
l4d_multislots_respawn_invincibletime "3.0"
