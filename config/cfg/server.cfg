// =====================================================================
//  L4D2 - cooperativo de 8 jugadores
//  hostname, contraseñas, dificultad y número de jugadores se configuran
//  en docker-compose.yml (se escriben en cfg/env.cfg al arrancar).
// =====================================================================

// --- Red / lobby -------------------------------------------------------
sv_lan 0
sv_region 255
// 0 = se puede entrar con "connect IP:27015" además de desde el lobby
sv_allow_lobby_connect_only 0
// L4DToolZ: 0 = acepta reservas de lobby; l4d_unreservelobby las quita
// cuando entran los 4 primeros para que puedan entrar los otros 4
sv_force_unreserved 0
sv_steam_bypass 0
sv_anti_sharing 0

// --- 8 supervivientes --------------------------------------------------
// Permite usar los personajes de L4D1 como supervivientes 5-8
sm_cvar precache_all_survivors 1
// Evita expulsiones por diferencias en archivos de addons
sm_cvar sv_consistency 0
// Evita que el cambio de mapa se quede colgado si alguien se desconecta
sm_cvar director_transition_timeout 50
sm_cvar director_unfreeze_time 40

// --- Varios ------------------------------------------------------------
sv_alltalk 0
sv_cheats 0
sv_hibernate_when_empty 1
sv_logecho 1
log on

exec env.cfg
