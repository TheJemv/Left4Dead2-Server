// =====================================================================
//  L4D2 - versus vanilla
//  hostname y contraseñas se configuran en docker-compose.yml
//  (se escriben en cfg/env.cfg al arrancar).
// =====================================================================

// --- Red / lobby -------------------------------------------------------
sv_lan 0
sv_region 255
// 0 = se puede entrar con "connect IP:27015" además de desde el lobby
sv_allow_lobby_connect_only 0

// --- Varios ------------------------------------------------------------
sv_alltalk 0
sv_cheats 0
sv_hibernate_when_empty 1
sv_logecho 1
log on

exec env.cfg
